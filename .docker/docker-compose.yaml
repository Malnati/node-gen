services:
  api:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: api
    restart: always
    ports:
      - "3002:3001"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy # A API aguarda o Postgres
    networks:
      - gerador-net

  frontend:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.frontend
    container_name: frontend
    restart: always
    ports:
      - "3003:3000"  # Altere a porta conforme necessário
    depends_on:
      - api  # O frontend aguarda o backend
    networks:
      - gerador-net

  postgres:
    platform: linux/amd64
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data  # Volume interno do contêiner
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gerador-net

# Volume interno para armazenar os dados do PostgreSQL
volumes:
  pgdata:

networks:
  gerador-net:
    driver: bridge
