# .docker/sspa/sspa.conf
server {
    listen 9000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    set $is_orchestrator_route 0;
    if ($uri = "/") { set $is_orchestrator_route 1; }
    if ($uri ~* "^/(accounts|addresses|auth|communications|config|consents|contacts|gmail|google-calendar|google-drive|llm|logistics|maps|notifications|orders|payments|products|reports|roles|schedule|selling|tenant|todo|transactions|users|warehouse)/?$") { set $is_orchestrator_route 1; }

    location / { try_files $uri $uri/ @spa; }

    location @spa {
        if ($is_orchestrator_route = 0) { return 404; }
        rewrite ^ /index.html break;
    }
}
