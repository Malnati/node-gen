# .docker/docker-compose.projects.postgres.yml
services:
  postgres-shared:
    image: postgres:16-alpine
    container_name: nodegen-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  apis:
    image: node-gen-apis:latest
    build:
      context: /
      dockerfile: root/w/node-gen/.docker/Dockerfile.projects.postgres
    container_name: nodegen-apis
    ports:
      - "3001-3099:3001-3099"
    depends_on:
      postgres-shared:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres-shared
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    volumes:
      - /root/w/node-gen/test/e2e-generator/projects:/projects-source
    entrypoint: ["/entrypoint.projects.postgres.sh"]

volumes:
  postgres-data:
