# .docker/docker-compose.projects.postgres.yml
services:
  postgres-shared:
    image: postgres:16-alpine
    container_name: nodegen-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    # Ports removed for isolation
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - nodegen-network

  apis:
    image: node-gen-apis:latest
    build:
      context: /root/w/node-gen
      dockerfile: .docker/Dockerfile.projects.postgres
    container_name: nodegen-apis
    # Ports removed for isolation
    depends_on:
      postgres-shared:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres-shared
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      E2E_SKIP_JWT: "true"
    volumes:
      - /root/w/node-gen/projects:/projects-source
      - /root/w/node-gen/output:/output
    entrypoint: ["/entrypoint.projects.postgres.sh"]
    networks:
      - nodegen-network

  sspa:
    image: node-gen-sspa:latest
    build:
      context: /root/w/node-gen
      dockerfile: .docker/Dockerfile.sspa
    container_name: nodegen-sspa
    # Ports removed for isolation
    depends_on:
      apis:
        condition: service_started
    environment:
      MFES_DIR: /mfe-output
      SSPA_SKIP_AUTH: "${SSPA_SKIP_AUTH:-true}"
      VITE_PUBLIC_URL: "${VITE_PUBLIC_URL:-http://localhost:9000}"
      VITE_SERVICE_DISCOVERY_URL: "${VITE_SERVICE_DISCOVERY_URL:-http://localhost:3015}"
      VITE_MFE_BASE_URL: "${VITE_MFE_BASE_URL:-http://localhost:9000}"
    volumes:
      - /root/w/node-gen/output:/mfe-output:ro
    networks:
      - nodegen-network

  service-discovery:
    image: node:22-alpine
    container_name: nodegen-service-discovery
    working_dir: /app
    # Ports removed for isolation
    environment:
      PORT: "${SERVICE_DISCOVERY_PORT:-3015}"
      DISCOVERY_TIMEOUT_MS: "${DISCOVERY_TIMEOUT_MS:-1200}"
      DISCOVERY_USE_LOCALHOST: "${DISCOVERY_USE_LOCALHOST:-true}"
      DISCOVERY_APPS_DIR: "${DISCOVERY_APPS_DIR:-/mfe-output/manifests}"
      DISCOVERY_APPS_JSON: "${DISCOVERY_APPS_JSON:-[]}"
      VITE_PUBLIC_URL: "${VITE_PUBLIC_URL:-http://localhost:9000}"
      VITE_SERVICE_DISCOVERY_URL: "${VITE_SERVICE_DISCOVERY_URL:-http://localhost:3015}"
      VITE_MFE_BASE_URL: "${VITE_MFE_BASE_URL:-http://localhost:9000}"
    volumes:
      - /root/w/node-gen/demo/service-discovery:/app
      - /root/w/node-gen/output:/mfe-output:ro
    command: sh -lc "npm install --no-audit --no-fund && npm run build && npm run start"
    networks:
      - nodegen-network

  proxy:
    image: caddy:2-alpine
    container_name: nodegen-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-localhost}"
    volumes:
      - /root/w/node-gen/.docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sspa
      - service-discovery
      - apis
    networks:
      - nodegen-network

volumes:
  postgres-data:
  caddy_data:
  caddy_config:

networks:
  nodegen-network:
    driver: bridge
