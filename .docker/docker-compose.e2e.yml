# .docker/docker-compose.e2e.yml
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - ./test/e2e-generator/projects/todo/db/database.mysql.ddl:/docker-entrypoint-initdb.d/01-schema.sql
      - ./test/e2e-generator/projects/selling/db/init.mysql.sql:/docker-entrypoint-initdb.d/02-selling.sql
      - ./test/e2e-generator/projects/schedule/db/database.mysql.sql:/docker-entrypoint-initdb.d/03-schedule.sql
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./test/e2e-generator/pg-init/scripts:/docker-entrypoint-initdb.d
      - ./test/e2e-generator:/e2e-mock
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
  e2e:
    build:
      context: .
      dockerfile: .docker/Dockerfile.e2e
    image: node-gen-e2e:latest
    entrypoint: ["/app/.docker/entrypoint.e2e.sh"]
    environment:
      E2E_DB_TYPES: ${E2E_DB_TYPES:-sqlite,postgres,mysql,sqlserver}
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
      DB_MYSQL_HOST: mysql
      DB_MYSQL_PORT: "3306"
      DB_MYSQL_USER: e2e
      DB_MYSQL_PASSWORD: e2e
      DB_SQLSERVER_HOST: sqlserver
      DB_SQLSERVER_PORT: "1433"
      DB_SQLSERVER_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_started
