# .docker/docker-compose.e2e.yml
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 120s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
  sqlserver:
    build:
      context: .
      dockerfile: .docker/Dockerfile.sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sqlservr || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
  e2e:
    build:
      context: .
      dockerfile: .docker/Dockerfile.e2e
    image: node-gen-e2e:latest
    entrypoint: ["/app/.docker/entrypoint.e2e.sh"]
    environment:
      E2E_DB_TYPES: ${E2E_DB_TYPES:-sqlite,postgres,mysql,sqlserver}
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
      DB_MYSQL_HOST: mysql
      DB_MYSQL_PORT: "3306"
      DB_MYSQL_USER: e2e
      DB_MYSQL_PASSWORD: e2e
      DB_MYSQL_INIT_USER: root
      DB_MYSQL_INIT_PASSWORD: root
      DB_SQLSERVER_HOST: sqlserver
      DB_SQLSERVER_PORT: "1433"
      DB_SQLSERVER_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
