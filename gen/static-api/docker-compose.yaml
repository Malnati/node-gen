# gen/static/docker-compose.yaml
services:
  db:
    image: postgres:12
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth
    environment:
      - PORT=3000
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_TYPE=postgres
      - NODE_ENV=production
    ports:
      - '3000:3000'
    depends_on:
      - db