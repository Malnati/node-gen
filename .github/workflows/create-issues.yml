name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Merge check
        run: |
          set -e
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Pull request foi fechado sem merge. Saindo."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # lista bodies das issues existentes
          existing=$(gh issue list --limit 1000 --json body --jq '.[] .body')

          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue

            # pula se já houver issue que contenha o marcador
            if echo "$existing" | grep -q "@Origem-issue: $file"; then
              echo "Issue já existe para $file"
              continue
            fi

            # extrai título e corpo sem frontmatter
            title=$(grep '^name:' "$file" \
              | sed -E 's/^name:[[:space:]]*//; s/^"//; s/"$//; s/^'\''//; s/'\''$//')
            body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")

            # cria a issue incluindo o marcador único (com apenas uma quebra de linha)
            gh issue create \
              --title "$title" \
              --body "${body}\n@Origem-issue: $file"
          done
