name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Merge check
        run: |
          set -e
          # Workflow só executa quando um PR é mergeado na main.
          # No GitHub, quando um PR é encerrado com:
          # 	•	Merge normal
          # 	•	Squash merge
          # 	•	Rebase and merge
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Pull request was closed without merge. Exiting."
            exit 0
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue
          
            # pular se já tiver File: <caminho> na última linha
            if grep -Eq '^File: '"$file"'$' "$file"; then
              echo "Já processado: $file"
              continue
            fi
          
            # anexa marcador no fim do arquivo
            printf '\nFile: %s\n' "$file" >> "$file"
            git add "$file"
          
            # extrai título e corpo
            title=$(grep '^name:' "$file" | sed -e 's/^name:[[:space:]]*//' -e 's/"//g' -e "s/'//g")
            body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")
          
            # cria a issue com o marcador
            gh issue create --title "$title" \
              --body "${body}\n\nFile: $file"
          done
