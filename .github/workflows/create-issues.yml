name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - '.github/ISSUE/*.md'
  workflow_dispatch:

jobs:
  create-issues:
    permissions:
      issues: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Merge check
        run: |
          set -e
          # Workflow só executa quando um PR é mergeado na main.
          # No GitHub, quando um PR é encerrado com:
          # 	•	Merge normal
          # 	•	Squash merge
          # 	•	Rebase and merge
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Pull request was closed without merge. Exiting."
            exit 0
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        # Os runners do Ubuntu já incluem gh e uuidgen, então não é necessário instalar
      - name: Add UUID to templates
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Se BEFORE estiver vazio, este é o primeiro commit disponível para o
          # workflow (por exemplo em execução manual). Nesse caso é preciso varrer
          # todos os templates de issue do repositório.
          # Verifica se BEFORE está vazio para definir quais arquivos analisar
          if [ -z "$BEFORE" ]; then
            # Lista todos os templates existentes quando não há commit anterior
            files=$(git ls-files '.github/ISSUE/*.md')
            echo "BEFORE not set, processing all templates: $files"
          else
            # Caso contrário, procura apenas os templates alterados neste push
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- '.github/ISSUE/*.md')
            echo "BEFORE=$BEFORE -> changed templates: $files"
          fi
          changed=false
          # Para cada template encontrado, adiciona ou atualiza o UUID
          # Abre cada arquivo encontrado para criar a issue correspondente
          for file in $files; do
            [ -f "$file" ] || continue
            # Gera um UUID com uuidgen quando disponível; caso contrário usa
            # o módulo crypto do Node.js.
            uuid=$(command -v uuidgen >/dev/null && uuidgen || node -e "console.log(require('crypto').randomUUID())")
            echo "Generated UUID $uuid for $file"
            if grep -q '^uuid:' "$file"; then
                # Substitui a entrada uuid existente
              sed -i "s/^uuid:.*/uuid: $uuid/" "$file"
              echo "Replaced uuid in $file"
            else
                # Insere o uuid logo abaixo da linha de assignees
              sed -i "/^assignees:/a uuid: $uuid" "$file"
              echo "Inserted uuid in $file"
            fi
            git add "$file"
            echo "Staged $file with new UUID"
            changed=true
          done
          # Se algum arquivo foi alterado, abre um PR com as atualizacoes de UUID
          if [ "$changed" = true ]; then
            branch="uuid-update-$GITHUB_RUN_ID"
            echo "Opening PR on branch $branch"
            git checkout -b "$branch"
            git commit -m "Add UUID to issue templates"
            git push origin "$branch"
            gh pr create --title "Add UUID to issue templates" --body "Atualiza templates de issue com uuid" --head "$branch" --base main
            git checkout main
          fi
      - name: Create issues and PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BEFORE="${{ github.event.before }}"
          # Detecta quais templates mudaram neste push. Se BEFORE estiver vazio
          # listamos todos; caso contrário, comparamos com o commit anterior.
          # Novamente verificamos BEFORE para decidir quais arquivos gerar issues
          if [ -z "$BEFORE" ]; then
            # Todos os templates serão processados quando BEFORE não existe
            files=$(git ls-files '.github/ISSUE/*.md')
            echo "BEFORE not set, creating issues for all templates: $files"
          else
            # Apenas os templates modificados em relacao ao commit anterior
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- '.github/ISSUE/*.md')
            echo "BEFORE=$BEFORE -> changed templates for issue creation: $files"
          fi
          for file in $files; do
            [ -f "$file" ] || continue
            echo "Processing $file"
            # Extrai o título do template de issue
            title=$(grep '^name:' "$file" | head -n1 | sed 's/^name:[[:space:]]*//' | tr -d '"')
            echo "title=$title"
            # Normaliza o título para uso no nome da branch
            sanitized=$(echo "$title" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
            echo "sanitized=$sanitized"
            # Extrai metadados adicionais
            labels=$(grep '^labels:' "$file" | head -n1 | sed 's/^labels:[[:space:]]*//' | tr -d '"')
            echo "labels=$labels"
            assignees=$(grep '^assignees:' "$file" | head -n1 | sed 's/^assignees:[[:space:]]*//' | tr -d "'")
            echo "assignees=$assignees"
            uuid=$(grep '^uuid:' "$file" | head -n1 | sed 's/^uuid:[[:space:]]*//')
            echo "uuid=$uuid"
            # Obtém o corpo após o frontmatter
            body=$(awk 'BEGIN{section=0} /^---$/{section++; next} section>=2 {print}' "$file")
            body="$body\n\nUUID: $uuid"
            # Cria a issue e captura sua URL
            issue_url=$(gh issue create --title "$title" --body "$body" ${labels:+--label "$labels"} ${assignees:+--assignee "$assignees"})
            echo "Created issue at $issue_url"
            issue_number=$(basename "$issue_url")
            echo "issue_number=$issue_number"
            branch="issue-$issue_number-$sanitized"
            git checkout -b "$branch"
            git commit --allow-empty -m "Start work on #$issue_number"
            git push origin "$branch"
            pr_title=$(echo "$title" | tr -cd '[:alnum:][:space:]-')
            gh pr create --title "$pr_title" --body "Closes #$issue_number" --head "$branch" --base main
            git checkout main
          done
