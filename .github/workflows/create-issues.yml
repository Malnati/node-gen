name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Merge check
        run: |
          set -e
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Pull request was closed without merge. Exiting."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue

            # pula se já tiver marca única no fim
            if grep -Eq '^@Origem-issue: '"$file"'$' "$file"; then
              echo "Já processado: $file"
              continue
            fi

            # anexa marcador único ao fim do arquivo
            printf '\n@Origem-issue: %s\n' "$file" >> "$file"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$file"

            # extrai título e corpo
            title=$(grep '^name:' "$file" \
              | sed -E 's/^name:[[:space:]]*//; s/^"//; s/"$//; s/^'\''//; s/'\''$//')
            body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")

            # cria a issue incluindo o marcador único
            gh issue create --title "$title" \
              --body "${body}\n\n@Origem-issue: $file"
          done

          # commit e push direto na main
          if ! git diff --cached --quiet; then
            git commit -m "Mark templates with @Origem-issue"
            git push https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }} HEAD:main
          fi
