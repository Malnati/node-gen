name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue

            # se não houver #UUID: <UUID> na última linha, gera e anexa
            if ! grep -Eq '^#UUID: [0-9a-fA-F-]{36}$' "$file"; then
              uuid=$(node -e "console.log(require('crypto').randomUUID())")
              printf '\n#UUID: %s\n' "$uuid" >> "$file"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "$file"

              title=$(grep '^name:' "$file" \
                | sed -e 's/^name:[[:space:]]*//' -e 's/"//g' -e "s/'//g")
              body=$(awk 'BEGIN {p=0} /^---$/ {p++; next} p>=2 {print}' "$file")

              gh issue create --title "$title" \
                --body "${body}\n\n#UUID: ${uuid}"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Add #UUID marker to issue templates"
            git push https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }} HEAD:main
          fi
