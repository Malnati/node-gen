name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue
          
            # se já existe issue cujo body contém o caminho, pula
            if gh issue list --limit 100 --json body \
                 --jq ".[] | select(.body | contains(\"$file\"))" \
               | grep -q .; then
              echo "Issue já criada para $file"
              continue
            fi
          
            title=$(grep '^name:' "$file" \
              | sed -e 's/^name:[[:space:]]*//' -e 's/"//g' -e "s/'//g")
            body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")
          
            gh issue create \
              --title "$title" \
              --body "${body}\n\nFile: $file"
          done
