name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for file in .github/ISSUE/*.md; do
            [ -f "$file" ] || continue
            # verifica marca #UUID: <UUID> na última linha
            if ! grep -Eq '^#UUID: [0-9a-fA-F-]{36}$' "$file"; then
              uuid=$(node -e "console.log(require('crypto').randomUUID())")
              printf '\n#UUID: %s\n' "$uuid" >> "$file"
              git add "$file"

              title=$(grep '^name:' "$file" \
                | sed 's/^name:[[:space:]]*//;s/[\"']//g')
              body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")

              gh issue create --title "$title" \
                --body "${body}\n\n#UUID: ${uuid}"
            fi
          done

          if ! git diff --cached --quiet; then
            branch="uuid-update-${{ github.run_id }}"
            git checkout -b "$branch"
            git commit -m "Add #UUID marker to issue templates"
            git push origin "$branch"
            gh pr create \
              --title "Add #UUID to issue templates" \
              --body  "Inclui marca #UUID em templates para criação de issues" \
              --head  "$branch" \
              --base  main
          fi
