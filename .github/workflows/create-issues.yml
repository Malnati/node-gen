name: Create Issues from Markdown

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-issues:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      issues: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Process issue templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Lista todos os templates Markdown
          templates=(.github/ISSUE/*.md)
          for file in "${templates[@]}"; do
            [ -f "$file" ] || continue
            # Se não há UUID, gera e insere
            if ! grep -q '^uuid:' "$file"; then
              uuid=$(node -e "console.log(require('crypto').randomUUID())")
              sed -i "/^assignees:/a uuid: $uuid" "$file"
              git add "$file"
              # Extrai título e corpo
              title=$(grep '^name:' "$file" | sed 's/^name:[[:space:]]*//;s/[\"']//g')
              body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")
              # Cria issue com o mesmo UUID
              gh issue create --title "$title" --body "${body}\n\nUUID: ${uuid}"
            fi
          done
          # Se houve inserções de UUID, cria branch e PR para aplicar no main
          if ! git diff --cached --quiet; then
            branch="uuid-update-${{ github.run_id }}"
            git checkout -b "$branch"
            git commit -m "Add UUID to issue templates"
            git push origin "$branch"
            gh pr create \
              --title "Add UUID to issue templates" \
              --body "Inclui UUID em templates para criação de issues" \
              --head "$branch" \
              --base main
          fi
