name: Create Issues from Markdown

on:
  push:
    branches:
      - main
    paths:
      - '.github/ISSUE/*.md'

jobs:
  create-issues:
    permissions:
      issues: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Ensure UUID and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          files=$(git diff --name-only HEAD^ HEAD -- '.github/ISSUE/*.md')
          for file in $files; do
            [ -f "$file" ] || continue

            # Insere UUID se faltar
            if ! grep -q '^uuid:' "$file"; then
              uuid=$(node -e "console.log(require('crypto').randomUUID())")
              sed -i "/^assignees:/a uuid: $uuid" "$file"
              git add "$file"
            fi

            # Extrai título e corpo
            title=$(grep '^name:' "$file" | sed 's/^name:[[:space:]]*//;s/\"//g')
            body=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' "$file")
            uuid=$(grep '^uuid:' "$file" | sed 's/^uuid:[[:space:]]*//')

            # Cria a issue
            gh issue create --title "$title" --body "$body\n\nUUID: $uuid"
          done

          # Se houve alterações no frontmatter, comita e envia
          git commit -m "Add UUID and create issues" || echo "Nothing to commit"
          git push origin main
